<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#070B16" />
    </linearGradient>

    <!-- Accent Glows -->
    <radialGradient id="glowCyan" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4facfe" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0" />
    </radialGradient>

    <!-- Shield Linear Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38ef7d" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0072ff" stop-opacity="0.6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.5" />
      <circle cx="40" cy="40" r="1" fill="#00f2fe" fill-opacity="0.3" />
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="380" rx="16" fill="url(#grid)" />
  <rect width="1200" height="380" rx="16" fill="url(#glowCyan)" />
  <rect width="1200" height="380" rx="16" fill="url(#glowPurple)" />

  <!-- Outer Frame Border -->
  <rect x="1.5" y="1.5" width="1197" height="377" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Abstract Cyber Circuit Lines -->
  <g stroke="#00f2fe" stroke-opacity="0.15" stroke-width="1.5" fill="none">
    <path d="M 50 80 L 180 80 L 220 120 L 350 120" />
    <path d="M 850 260 L 980 260 L 1020 220 L 1150 220" />
    <circle cx="350" cy="120" r="3" fill="#00f2fe" fill-opacity="0.5" />
    <circle cx="850" cy="260" r="3" fill="#00f2fe" fill-opacity="0.5" />
  </g>

  <!-- Left Icon / Emblem Section (Shield + Cyber Wings) -->
  <g transform="translate(90, 85)">
    <!-- Outer Glow Circle -->
    <circle cx="105" cy="105" r="95" fill="#00f2fe" fill-opacity="0.05" />
    <circle cx="105" cy="105" r="85" fill="none" stroke="#00f2fe" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="6 4" />

    <!-- Shield Shape -->
    <path d="M 105 25 
             C 145 25, 175 40, 180 65 
             C 180 125, 145 175, 105 195 
             C 65 175, 30 125, 30 65 
             C 35 40, 65 25, 105 25 Z" 
          fill="#0c192c" 
          stroke="url(#shieldGrad)" 
          stroke-width="3" 
          filter="url(#neonGlow)" />

    <!-- Inner Shield Inset -->
    <path d="M 105 40 
             C 135 40, 160 52, 164 72 
             C 164 120, 135 160, 105 176 
             C 75 160, 46 120, 46 72 
             C 50 52, 75 40, 105 40 Z" 
          fill="#08101d" 
          stroke="#00f2fe" 
          stroke-width="1.5" 
          stroke-opacity="0.4" />

    <!-- Stylized Wings -->
    <path d="M 65 95 L 85 85 L 95 95 L 85 105 Z" fill="#00f2fe" fill-opacity="0.7" />
    <path d="M 145 95 L 125 85 L 115 95 L 125 105 Z" fill="#00f2fe" fill-opacity="0.7" />

    <!-- Security Lock Center -->
    <rect x="90" y="98" width="30" height="24" rx="4" fill="url(#shieldGrad)" />
    <path d="M 96 98 V 89 C 96 84 100 80 105 80 C 110 80 114 84 114 89 V 98" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <circle cx="105" cy="110" r="2.5" fill="#060913" />
    <path d="M 105 112 V 116" stroke="#060913" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Text & Typography Section -->
  <g transform="translate(340, 95)">
    <!-- Top Micro Tag -->
    <g transform="translate(0, 10)">
      <rect x="0" y="0" width="182" height="24" rx="12" fill="#00f2fe" fill-opacity="0.12" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="12" cy="12" r="4" fill="#38ef7d" />
      <text x="24" y="16" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">HARDENING SUITE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="78" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Pterodactyl <tspan fill="url(#shieldGrad)">Security</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="112" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" letter-spacing="0.2">
      Automated access control, anti-tampering &amp; server isolation for Pterodactyl Panel
    </text>

    <!-- Badges / Feature Pills -->
    <g transform="translate(0, 146)">
      <!-- Pill 1: ID Lockdown -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="160" height="30" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="14" y="19" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔒 ID Whitelisting</text>
      </g>

      <!-- Pill 2: Anti-Deletion -->
      <g transform="translate(170, 0)">
        <rect x="0" y="0" width="170" height="30" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="14" y="19" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛡️ Deletion Guard</text>
      </g>

      <!-- Pill 3: Zero Telemetry -->
      <g transform="translate(350, 0)">
        <rect x="0" y="0" width="165" height="30" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="14" y="19" fill="#F472B6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ Zero Telemetry</text>
      </g>

      <!-- Pill 4: Safe Rollback -->
      <g transform="translate(525, 0)">
        <rect x="0" y="0" width="160" height="30" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="14" y="19" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📦 Safe .bak Rollback</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="0" y="376" width="1200" height="4" fill="url(#shieldGrad)" />
</svg>